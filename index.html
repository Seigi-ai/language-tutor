<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>言語 — Language Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07070e;
  --card: #0d0d1c;
  --border: rgba(140,130,255,0.12);
  --text: #ddddf5;
  --dim: #6060a0;
  --accent: #8b7cf7;
  --accent-dim: rgba(139,124,247,0.15);
  --user-bubble: rgba(139,124,247,0.12);
  --ai-bubble: rgba(255,255,255,0.04);
  --green: #4ade80;
  --red: #f87171;
}
 
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:'Space Mono',monospace; font-size:13px; }
 
#setup {
  position:fixed; inset:0; display:flex; align-items:center;
  justify-content:center; padding:28px; background:var(--bg); z-index:100;
}
.card { width:100%; max-width:380px; }
.big-title { font-family:'Shippori Mincho',serif; font-size:56px; font-weight:700;
  letter-spacing:-3px; color:#fff; line-height:1; }
.sub { color:var(--dim); font-size:10px; letter-spacing:.25em; text-transform:uppercase;
  margin:6px 0 44px; }
.label { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim);
  margin-bottom:8px; }
input.field {
  width:100%; background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:13px 16px; color:var(--text); font-family:'Space Mono',monospace; font-size:13px;
  outline:none; margin-bottom:16px; transition:border-color .2s;
}
input.field:focus { border-color:var(--accent); }
.hint { font-size:10px; color:var(--dim); margin-bottom:24px; }
.hint a { color:var(--accent); text-decoration:none; }
.primary-btn {
  width:100%; background:var(--accent); color:#fff; border:none; border-radius:10px;
  padding:15px; font-family:'Space Mono',monospace; font-size:13px; font-weight:700;
  letter-spacing:.05em; cursor:pointer; transition:opacity .2s;
}
.primary-btn:active { opacity:.8; }
 
#app { height:100%; display:flex; flex-direction:column; }
 
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; border-bottom:1px solid var(--border); flex-shrink:0;
}
.header-left { display:flex; align-items:center; gap:12px; }
.header-title { font-family:'Shippori Mincho',serif; font-size:24px; font-weight:700; color:#fff; }
.status-pill {
  display:flex; align-items:center; gap:6px; padding:4px 10px;
  border-radius:20px; border:1px solid var(--border); font-size:10px; color:var(--dim);
}
.dot { width:6px; height:6px; border-radius:50%; background:var(--dim); transition:background .3s; }
.dot.ok { background:var(--green); }
.dot.err { background:var(--red); }
.dot.connecting { background:#facc15; animation:blink 1s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
 
.lang-bar {
  display:flex; gap:8px; padding:12px 20px; overflow-x:auto;
  scrollbar-width:none; flex-shrink:0; border-bottom:1px solid var(--border);
}
.lang-bar::-webkit-scrollbar { display:none; }
.lang-tab {
  display:flex; align-items:center; gap:6px; padding:6px 14px;
  border-radius:20px; border:1px solid var(--border); background:transparent;
  color:var(--dim); font-family:'Space Mono',monospace; font-size:11px;
  cursor:pointer; white-space:nowrap; transition:all .2s; flex-shrink:0;
}
.lang-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
 
.transcript {
  flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column;
  gap:14px; scroll-behavior:smooth;
}
.transcript::-webkit-scrollbar { width:4px; }
.transcript::-webkit-scrollbar-track { background:transparent; }
.transcript::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
 
.placeholder {
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:10px; color:var(--dim); text-align:center;
  pointer-events:none; user-select:none;
}
.placeholder-native { font-family:'Shippori Mincho',serif; font-size:40px;
  color:rgba(139,124,247,.25); line-height:1; margin-bottom:4px; }
.placeholder-hint { font-size:11px; letter-spacing:.05em; }
 
.msg {
  max-width:88%; padding:11px 15px; border-radius:14px;
  line-height:1.65; font-size:13px; word-break:break-word;
}
.msg.user {
  align-self:flex-end; background:var(--user-bubble);
  border:1px solid rgba(139,124,247,.28); color:#c8c0ff;
}
.msg.ai { align-self:flex-start; background:var(--ai-bubble); border:1px solid var(--border); }
.msg-who { font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--dim); margin-bottom:5px; }
 
.replay-btn {
  display:inline-flex; align-items:center; justify-content:center;
  margin-left:8px; width:22px; height:22px; border-radius:50%;
  border:1px solid var(--border); background:transparent; color:var(--dim);
  font-size:11px; line-height:1; cursor:pointer; vertical-align:middle;
  transition:all .15s;
}
.replay-btn:hover { border-color:var(--accent); color:var(--accent); }
.replay-btn:active { opacity:.6; }
 
.controls {
  padding:20px 20px 28px; display:flex; flex-direction:column;
  align-items:center; gap:10px; flex-shrink:0; border-top:1px solid var(--border);
}
 
.mic-btn {
  width:76px; height:76px; border-radius:50%;
  border:2px solid var(--accent); background:transparent;
  color:var(--accent); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .2s; position:relative; flex-shrink:0;
}
.mic-btn.active {
  background:var(--accent); color:#fff;
  box-shadow:0 0 32px rgba(139,124,247,.4);
}
.mic-btn.active::before {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  border:1.5px solid rgba(139,124,247,.35); animation:ring 2s ease-out infinite;
}
.mic-btn.active::after {
  content:''; position:absolute; inset:-20px; border-radius:50%;
  border:1.5px solid rgba(139,124,247,.18); animation:ring 2s ease-out infinite .4s;
}
@keyframes ring { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.3)} }
 
.mic-label { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim); }
.mic-label.active { color:var(--accent); }
 
.text-row { width:100%; display:flex; gap:8px; align-items:center; }
.text-input {
  flex:1; background:var(--card); border:1px solid var(--border); border-radius:20px;
  padding:11px 16px; color:var(--text); font-family:'Space Mono',monospace; font-size:13px;
  outline:none; transition:border-color .2s;
}
.text-input:focus { border-color:var(--accent); }
.send-btn {
  width:40px; height:40px; border-radius:50%; border:none; background:var(--accent);
  color:#fff; display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; transition:opacity .2s;
}
.send-btn:active { opacity:.8; }
.header-right { display:flex; align-items:center; gap:8px; }
.fc-btn {
  display:flex; align-items:center; gap:6px; padding:6px 12px;
  border-radius:20px; border:1px solid var(--border); background:transparent;
  color:var(--dim); font-family:'Space Mono',monospace; font-size:11px;
  cursor:pointer; transition:all .2s;
}
.fc-btn:not(:disabled):hover { border-color:var(--accent); color:var(--accent); }
.fc-btn:disabled { opacity:.35; cursor:not-allowed; }
.fc-count {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:16px; height:16px; padding:0 4px; border-radius:8px;
  background:var(--accent); color:#fff; font-size:9px;
}
#fc-panel {
  position:fixed; inset:0; background:rgba(7,7,14,.92); backdrop-filter:blur(4px);
  z-index:90; display:none; flex-direction:column;

.fc-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; border-bottom:1px solid var(--border); flex-shrink:0;

.fc-title { font-family:'Shippori Mincho',serif; font-size:20px; color:#fff; }
.fc-close {
  background:transparent; border:1px solid var(--border); border-radius:50%;
  width:30px; height:30px; color:var(--dim); cursor:pointer; font-size:14px;
}
.fc-toolbar {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 20px; border-bottom:1px solid var(--border); flex-shrink:0;
}
.fc-modes { display:flex; gap:6px; }
.fc-mode-btn {
  padding:6px 12px; border-radius:20px; border:1px solid var(--border);
  background:transparent; color:var(--dim); font-family:'Space Mono',monospace;
  font-size:11px; cursor:pointer;
}
.fc-mode-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.fc-gen-btn {
  padding:6px 14px; border-radius:20px; border:none; background:var(--accent);
  color:#fff; font-family:'Space Mono',monospace; font-size:11px; cursor:pointer;
}
.fc-gen-btn:disabled { opacity:.5; cursor:wait; }
.fc-body {
  flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:24px; gap:18px; overflow-y:auto;
}
.fc-empty { color:var(--dim); text-align:center; font-size:12px; line-height:1.8; max-width:280px; }
.fc-card {
  width:100%; max-width:340px; min-height:200px; border-radius:16px;
  border:1px solid var(--border); background:var(--card); padding:24px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;

.fc-card .fc-phrase { font-size:22px; color:#fff; line-height:1.4; }
.fc-card .fc-translation { font-size:14px; color:var(--accent); display:none; }
.fc-card .fc-note { font-size:11px; color:var(--dim); display:none; line-height:1.6; }
.fc-card.flipped .fc-translation, .fc-card.flipped .fc-note { display:block; }
.fc-card .fc-hint { font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-top:6px; }
.fc-nav { display:flex; align-items:center; gap:16px; }
.fc-nav-btn {
  width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
  background:transparent; color:var(--text); cursor:pointer; font-size:14px;

.fc-nav-btn:disabled { opacity:.3; cursor:not-allowed; }
.fc-progress { font-size:10px; color:var(--dim); letter-spacing:.1em; }
.fc-quiz-actions { display:flex; gap:10px; }

  background:transparent; color:var(--text); font-family:'Space Mono',monospace;
  font-size:12px; cursor:pointer;
}
.fc-quiz-btn.miss { border-color:rgba(248,113,113,.4); color:var(--red); }
.fc-quiz-btn.got { border-color:rgba(74,222,128,.4); color:var(--green); }

const MODEL = 'models/gemini-3.1-flash-live-preview';
 
const WORKLET = `
class PCMProcessor extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) {
      const i16 = new Int16Array(ch.length);
      for (let i = 0; i < ch.length; i++) {
        const s = Math.max(-1, Math.min(1, ch[i]));
        i16[i] = s < 0 ? s * 32768 : s * 32767;
      }
      this.port.postMessage(i16.buffer, [i16.buffer]);
    }
    return true;
  }
}
registerProcessor('pcm-proc', PCMProcessor);
`;
 
const buf2b64 = buf => {
  let s = ''; const u = new Uint8Array(buf);
  for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
  return btoa(s);
};
const b64toI16 = b64 => {
  const s = atob(b64); const buf = new ArrayBuffer(s.length);
  const v = new Uint8Array(buf);
  for (let i = 0; i < s.length; i++) v[i] = s.charCodeAt(i);
  return new Int16Array(buf);
};
const i16toF32 = i16 => {
  const f = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f[i] = i16[i] / 32768;
  return f;
};

  const dot = $('dot'), txt = $('status-text');
  dot.className = 'dot' + (state ? ' '+state : '');
  txt.textContent = label;
}
 
function buildBar() {
  const bar = $('lang-bar'); bar.innerHTML = '';
  Object.entries(LANGS).forEach(([k, l]) => {
    const b = document.createElement('button');
    b.className = 'lang-tab' + (k === curLang ? ' active' : '');
    b.textContent = l.flag + ' ' + l.native;
    b.onclick = () => switchLang(k);
    bar.appendChild(b);
  });
}
 
function switchLang(k) {
  if (k === curLang) return;
  curLang = k; buildBar();
  const nt = $('native-text'); if (nt) nt.textContent = LANGS[k].native;
  clearTranscript(); playAt = 0;
  transcriptLog = []; curAiText = ''; updateFcButton();
  if (ws && ws.readyState === WebSocket.OPEN) {
    pendingReconnect = true; ws.close();
  } else { ws = null; connect(); }
}
 
function clearTranscript() {
  const t = $('transcript'); t.innerHTML = '';
  const ph = document.createElement('div'); ph.className = 'placeholder'; ph.id = 'placeholder';
  ph.innerHTML = `<div class="placeholder-native" id="native-text">${LANGS[curLang].native}</div>
    <div class="placeholder-hint">tap the mic and start speaking</div>`;
  t.appendChild(ph); curAiEl = null;
}
 
function hidePH() {
  const ph = $('placeholder'); if (ph) ph.remove();
}
 
function addMsg(role, text) {
  if (!text.trim()) return;
  hidePH();
  const t = $('transcript');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = `<div class="msg-who">${role === 'user' ? 'you' : LANGS[curLang].name + ' tutor'}</div>${text}`;
  t.appendChild(d); t.scrollTop = t.scrollHeight;
  transcriptLog.push({ role, text });
  updateFcButton();
  return d;
}
 
function startAiMsg() {
  hidePH();
  curAiChunks = [];
  const t = $('transcript');
  curAiEl = document.createElement('div');
  curAiEl.className = 'msg ai';
  curAiEl.innerHTML = `<div class="msg-who">${LANGS[curLang].name} tutor</div><span class="body"></span>`;
  t.appendChild(curAiEl); t.scrollTop = t.scrollHeight;
}
 
function appendAi(text) {
  if (!curAiEl) startAiMsg();
  curAiEl.querySelector('.body').textContent += text;
  curAiText += text;
  $('transcript').scrollTop = $('transcript').scrollHeight;
}

function endAiMsg() {
  if (curAiEl && curAiChunks.length) addReplayButton(curAiEl, curAiChunks.slice());
  if (curAiText.trim()) { transcriptLog.push({ role: 'ai', text: curAiText }); updateFcButton(); }
  curAiEl = null; curAiChunks = []; curAiText = '';
}
 
function connect() {
  setStatus('connecting', 'connecting…');
  const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;
  ws = new WebSocket(url);
  wsReady = false;
 
  ws.onopen = () => {
    ws.send(JSON.stringify({
      setup: {
        model: MODEL,
        generationConfig: {
          responseModalities: ['AUDIO'],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Aoede' } } }
        },
        inputAudioTranscription: {},
        outputAudioTranscription: {},
        systemInstruction: { parts: [{ text: LANGS[curLang].prompt }] }
      }
    }));
  };
 
  ws.onmessage = async e => {
    let msg;
    try {
      const raw = typeof e.data === 'string' ? e.data : await e.data.text();
      msg = JSON.parse(raw);
    } catch { return; }
 
    try {
      if (msg.setupComplete) { wsReady = true; setStatus('ok', 'connected'); return; }
 
      const sc = msg.serverContent;
      if (!sc) return;
 
      if (sc.modelTurn?.parts) {
        for (const p of sc.modelTurn.parts) {
          if (p.text) appendAi(p.text);
          if (p.inlineData?.mimeType?.startsWith('audio/pcm')) {
            playChunk(p.inlineData.data);
            if (!curAiEl) startAiMsg();
            curAiChunks.push(p.inlineData.data);
          }
        }
      }
 
      if (sc.outputTranscription?.text) appendAi(sc.outputTranscription.text);
      if (sc.inputTranscription?.text) addMsg('user', sc.inputTranscription.text);
      if (sc.turnComplete) endAiMsg();
    } catch(err) { console.error('msg handler error:', err); }
  };
 
  ws.onerror = () => setStatus('err', 'error');
  ws.onclose = (e) => {
    wsReady = false;
    const reason = e.reason || ('code:' + e.code) || 'unknown';
    setStatus('err', 'disconnected: ' + reason);
    if (pendingReconnect) { pendingReconnect = false; setTimeout(connect, 300); }
  };
}
 
function ensureOut() {
  if (!outCtx) outCtx = new AudioContext({ sampleRate: 24000 });
  if (outCtx.state === 'suspended') outCtx.resume();
}
 
function playChunk(b64) {
  try {
    ensureOut();
    const f32 = i16toF32(b64toI16(b64));
    const buf = outCtx.createBuffer(1, f32.length, 24000);
    buf.getChannelData(0).set(f32);
    const src2 = outCtx.createBufferSource();
    src2.buffer = buf; src2.connect(outCtx.destination);
    const now = outCtx.currentTime;
    const t = Math.max(now, playAt);
    src2.start(t); playAt = t + buf.duration;
  } catch(e) { console.error('playChunk error:', e); }
}
 
function addReplayButton(el, chunks) {
  const btn = document.createElement('button');
  btn.className = 'replay-btn';
  btn.title = 'Replay';
  btn.textContent = '🔊';
  btn.onclick = () => replayChunks(chunks);
  el.appendChild(btn);
}
 
function replayChunks(chunks) {
  try {
    ensureOut();
    let t = outCtx.currentTime;
    chunks.forEach(b64 => {
      const f32 = i16toF32(b64toI16(b64));
      const buf = outCtx.createBuffer(1, f32.length, 24000);
      buf.getChannelData(0).set(f32);
      const s = outCtx.createBufferSource();
      s.buffer = buf; s.connect(outCtx.destination);
      s.start(t); t += buf.duration;
    });
  } catch(e) { console.error('replayChunks error:', e); }
}
 
async function startMic() {
  if (!inCtx) {
    inCtx = new AudioContext({ sampleRate: 16000 });
    const blob = new Blob([WORKLET], { type: 'application/javascript' });
    await inCtx.audioWorklet.addModule(URL.createObjectURL(blob));
  }
  if (inCtx.state === 'suspended') await inCtx.resume();
 
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    video: false
  });
 
  src = inCtx.createMediaStreamSource(micStream);
  worklet = new AudioWorkletNode(inCtx, 'pcm-proc');
  const silent = inCtx.createGain(); silent.gain.value = 0;
  src.connect(worklet); worklet.connect(silent); silent.connect(inCtx.destination);
 
  worklet.port.onmessage = ev => {
    if (!ws || ws.readyState !== 1 || !wsReady) return;
    if (inCtx.state === 'suspended') inCtx.resume();
    if (outCtx && outCtx.state === 'suspended') outCtx.resume();
    if (outCtx && outCtx.currentTime < playAt) return;
    ws.send(JSON.stringify({
      realtimeInput: { audio: { data: buf2b64(ev.data), mimeType: 'audio/pcm;rate=16000' } }
    }));
  };
}
 
function stopMic() {
  if (src) { src.disconnect(); src = null; }
  if (worklet) { worklet.disconnect(); worklet = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}
 
async function toggleMic() {
  const btn = $('mic-btn'), lbl = $('mic-label');
  if (micOn) {
    micOn = false; stopMic();
    btn.classList.remove('active');
    lbl.textContent = 'tap to speak'; lbl.className = 'mic-label';
  } else {
    try {
      await startMic();
      micOn = true;
      btn.classList.add('active');
      lbl.textContent = 'listening…'; lbl.className = 'mic-label active';
    } catch {
      alert('Microphone access denied. Please allow mic in browser settings.');
    }
  }
}
 
function sendText() {
  const input = $('text-input');
  const text = input.value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== 1 || !wsReady) {
    alert('Not connected yet — wait a moment and try again.');
    return;
  }
  if (micOn) toggleMic(); // avoid sending mic audio + typed text at the same time
  addMsg('user', text);
  ws.send(JSON.stringify({
    clientContent: {
      turns: [{ role: 'user', parts: [{ text }] }],
      turnComplete: true
    }
  }));
  input.value = '';
}
function updateFcButton() {
  const hasContent = transcriptLog.some(m => m.role === 'ai' && m.text.trim());
  const btn = $('fc-open-btn');
  if (btn) btn.disabled = !hasContent && flashcards.length === 0;
  const badge = $('fc-count');
  if (badge) {
    if (flashcards.length) { badge.style.display = 'inline-flex'; badge.textContent = flashcards.length; }
    else badge.style.display = 'none';
  }
}

function openFlashcards() { $('fc-panel').style.display = 'flex'; renderFcBody(); }
function closeFlashcards() { $('fc-panel').style.display = 'none'; }

function setFcMode(mode) {
  fcMode = mode;
  $('fc-mode-browse').classList.toggle('active', mode === 'browse');
  $('fc-mode-quiz').classList.toggle('active', mode === 'quiz');
  if (mode === 'quiz') startQuiz();
  renderFcBody();
}

async function generateFlashcards() {
  if (fcBusy) return;
  const convo = transcriptLog.filter(m => m.text.trim());
  if (!convo.length) { alert("Talk a bit first so there's something to pull flashcards from."); return; }
  if (!apiKey) { alert('No API key set.'); return; }

  fcBusy = true;
  const btn = $('fc-gen-btn');
  const prevLabel = btn.textContent;
  btn.disabled = true; btn.textContent = 'Generating…';

  const transcriptText = convo.map(m => `${m.role === 'user' ? 'Learner' : LANGS[curLang].name + ' tutor'}: ${m.text}`).join('\n');
  const prompt = `You are building study flashcards from a transcript of a spoken ${LANGS[curLang].name} lesson.
Pick out ${LANGS[curLang].name} words or phrases genuinely worth reviewing: new vocabulary the tutor introduced, corrections the tutor made to the learner's mistakes, or phrases the learner clearly stumbled on. Skip greetings and filler.
Return ONLY a JSON array (max 12 items), each item: {"phrase": "<word or phrase in ${LANGS[curLang].name}>", "translation": "<English meaning>", "note": "<one short sentence on usage or why it matters>"}.
If there's nothing worth flashcarding, return [].

TRANSCRIPT:
${transcriptText}`;

  try {
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${FC_MODEL}:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        generationConfig: { responseMimeType: 'application/json' }
      })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
    const parsed = JSON.parse(raw);
    const existing = new Set(flashcards.map(c => c.phrase.toLowerCase().trim()));
    let added = 0;
    for (const c of parsed) {
      if (!c?.phrase || !c?.translation) continue;
      const key = c.phrase.toLowerCase().trim();
      if (existing.has(key)) continue;
      existing.add(key);
      flashcards.push({ phrase: c.phrase, translation: c.translation, note: c.note || '', lang: curLang });
      added++;
    }
    if (!added) alert('No new flashcard-worthy phrases found yet — keep chatting and try again.');
  } catch (err) {
    console.error('generateFlashcards error:', err);
    alert('Could not generate flashcards: ' + err.message);
  } finally {
    fcBusy = false;
    btn.disabled = false; btn.textContent = prevLabel;
    updateFcButton();
    fcIndex = Math.min(fcIndex, Math.max(0, flashcards.length - 1));
    renderFcBody();
  }
}

function renderFcBody() {
  const body = $('fc-body');
  if (!flashcards.length) {
    body.innerHTML = `<div class="fc-empty">No flashcards yet.<br>Have a bit of conversation, then tap "Generate from conversation" to pull vocab worth reviewing.</div>`;
    return;
  }
  if (fcMode === 'quiz') renderQuiz(); else renderBrowse();
}

function renderBrowse() {
  const body = $('fc-body');
  const c = flashcards[fcIndex];
  body.innerHTML = `
    <div class="fc-card" id="fc-card">
      <div class="fc-phrase">${c.phrase}</div>
      <div class="fc-translation">${c.translation}</div>
      ${c.note ? `<div class="fc-note">${c.note}</div>` : ''}
      <div class="fc-hint">tap to flip</div>
    </div>
    <div class="fc-nav">
      <button class="fc-nav-btn" id="fc-prev" ${fcIndex === 0 ? 'disabled' : ''}>‹</button>
      <div class="fc-progress">${fcIndex + 1} / ${flashcards.length}</div>
      <button class="fc-nav-btn" id="fc-next" ${fcIndex === flashcards.length - 1 ? 'disabled' : ''}>›</button>
    </div>`;
  $('fc-card').onclick = () => $('fc-card').classList.toggle('flipped');
  $('fc-prev').onclick = () => { fcIndex--; renderBrowse(); };
  $('fc-next').onclick = () => { fcIndex++; renderBrowse(); };
}

function startQuiz() {
  quizOrder = flashcards.map((_, i) => i).sort(() => Math.random() - 0.5);
  quizPos = 0; quizScore = 0; quizRevealed = false;
}

function renderQuiz() {
  const body = $('fc-body');
  if (!quizOrder.length) startQuiz();
  if (quizPos >= quizOrder.length) {
    body.innerHTML = `
      <div class="fc-empty">Quiz complete!<br>Score: ${quizScore} / ${quizOrder.length}</div>
      <button class="fc-quiz-btn" id="fc-requiz">Quiz me again</button>`;
    $('fc-requiz').onclick = () => { startQuiz(); renderQuiz(); };
    return;
  }
  const c = flashcards[quizOrder[quizPos]];
  body.innerHTML = `
    <div class="fc-progress">card ${quizPos + 1} / ${quizOrder.length} &nbsp;·&nbsp; score ${quizScore}</div>
    <div class="fc-card" id="fc-card">
      <div class="fc-phrase">${c.phrase}</div>
      <div class="fc-translation">${c.translation}</div>
      ${c.note ? `<div class="fc-note">${c.note}</div>` : ''}
      ${quizRevealed ? '' : '<div class="fc-hint">tap to reveal</div>'}
    </div>
    ${quizRevealed ? `
      <div class="fc-quiz-actions">
        <button class="fc-quiz-btn miss" id="fc-miss">Missed it</button>
        <button class="fc-quiz-btn got" id="fc-got">Got it</button>
      </div>` : ''}`;
  const card = $('fc-card');
  if (!quizRevealed) {
    card.onclick = () => { quizRevealed = true; renderQuiz(); };
  } else {
    card.classList.add('flipped');
    $('fc-miss').onclick = () => { quizPos++; quizRevealed = false; renderQuiz(); };
    $('fc-got').onclick = () => { quizScore++; quizPos++; quizRevealed = false; renderQuiz(); };
  }
}
  
  
buildBar();
$('mic-btn').onclick = toggleMic;
$('send-btn').onclick = sendText;
$('text-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
$('fc-open-btn').onclick = openFlashcards;
$('fc-close-btn').onclick = closeFlashcards;
$('fc-mode-browse').onclick = () => setFcMode('browse');
$('fc-mode-quiz').onclick = () => setFcMode('quiz');
$('fc-gen-btn').onclick = generateFlashcards;
  
const saved = localStorage.getItem('gem_k');
if (saved) $('api-key').value = saved;
 
$('api-key').addEventListener('keydown', e => { if (e.key === 'Enter') $('start-btn').click(); });
 
$('start-btn').onclick = () => {
  apiKey = $('api-key').value.trim();
  if (!apiKey) { $('api-key').focus(); return; }
  localStorage.setItem('gem_k', apiKey);
  $('setup').style.display = 'none';
  $('app').style.display = 'flex';
  connect();
};
</script>
</body>
</html>
